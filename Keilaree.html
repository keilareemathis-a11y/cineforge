<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keilaree AI Story Studio</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1020;
color:white;
overflow:hidden;
}

#ui{
position:absolute;
top:10px;
left:10px;
width:320px;
background:#1b2244;
padding:15px;
border-radius:12px;
z-index:10;
}

input,button{
width:100%;
padding:8px;
margin-top:6px;
border-radius:6px;
border:none;
}

button{
background:#4f8cff;
color:white;
font-weight:bold;
}

#dialogue{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
padding:12px 16px;
border-radius:10px;
font-size:18px;
}
</style>

</head>
<body>

<div id="ui">

<h2>Keilaree</h2>

<input id="name" placeholder="character name">
<button onclick="addCharacter()">Add Character</button>

<button onclick="interaction()">Interaction</button>
<button onclick="rumor()">Rumor</button>
<button onclick="runWorld()">Run 10 Steps</button>

</div>

<div id="dialogue">Welcome to Keilaree</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,6,10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(4,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.6));

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(30,30),
new THREE.MeshStandardMaterial({color:0x20295c})
);

floor.rotation.x=-Math.PI/2;
scene.add(floor);

class Character{

constructor(name){

this.name=name;

this.personality={
aggression:Math.random(),
empathy:Math.random(),
gossip:Math.random()
};

this.trust={};

this.mesh=createMesh(name);

}

}

let characters=[
new Character("Mara"),
new Character("Juno"),
new Character("Alex"),
new Character("Nova")
];

layout();

function createMesh(name){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(0.8,1.6,0.6),
new THREE.MeshStandardMaterial({color:Math.random()*0xffffff})
);

body.position.y=1;

const head=new THREE.Mesh(
new THREE.SphereGeometry(0.35,20,20),
new THREE.MeshStandardMaterial({color:0xf2d2b6})
);

head.position.y=2;

group.add(body);
group.add(head);

scene.add(group);

return group;

}

function layout(){

const radius=3;

characters.forEach((c,i)=>{

const angle=i/characters.length*Math.PI*2;

c.mesh.position.x=Math.cos(angle)*radius;
c.mesh.position.z=Math.sin(angle)*radius;

});

}

function pick(arr){

return arr[Math.floor(Math.random()*arr.length)];

}

const conflictLines=[
"You're pushing this too far.",
"You knew exactly what you were doing.",
"I'm not letting that slide.",
"Don't act innocent now.",
"This was always going to explode.",
"I warned you already.",
"That move cost you trust.",
"You're playing a dangerous game."
];

const allianceLines=[
"We should stick together.",
"For now we work as a team.",
"We can use this situation.",
"Stay close and stay quiet.",
"We might survive this if we're smart.",
"Don't break the alliance.",
"We're stronger together.",
"Trust me this once."
];

const rumorLines=[
"I heard something about TARGET.",
"People are talking about TARGET.",
"There's a rumor going around.",
"Something feels off about TARGET.",
"Keep an eye on TARGET.",
"Someone mentioned TARGET earlier.",
"I wouldn't trust TARGET tonight.",
"The room keeps whispering about TARGET."
];

const neutralLines=[
"This place feels strange tonight.",
"Everyone's watching everyone.",
"The mood just shifted.",
"Something is coming.",
"No one here is calm.",
"Too many secrets in one room.",
"The tension is rising.",
"This silence is suspicious."
];

function speak(text){

document.getElementById("dialogue").innerText=text;

}

function interaction(){

const a=pick(characters);
const b=pick(characters);

if(a===b)return;

let line;

if(Math.random()<0.4){

line=pick(conflictLines);
speak(a.name+": "+line);

}else{

line=pick(allianceLines);
speak(a.name+": "+line);

}

}

function rumor(){

const a=pick(characters);
const target=pick(characters);

let line=pick(rumorLines).replace("TARGET",target.name);

speak(a.name+": "+line);

}

function runWorld(){

for(let i=0;i<10;i++){

if(Math.random()<0.5)interaction();
else rumor();

}

}

function addCharacter(){

const name=document.getElementById("name").value;

if(!name)return;

characters.push(new Character(name));

layout();

}

function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
