version: '3.8'

services:
  api:
    image: myapi:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/mydb

  web:
    image: myweb:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - '80:80'

  db:
    image: postgres:latest
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: