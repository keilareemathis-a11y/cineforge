[alembic]
script_location = apps/api/alembic
# ... other alembic configurations

[loggers]
keys = root, sqlalcemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = []
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(message)s
